robot:
  name: Go2W
  geometry:
    robot_height_cm: 80.0
    robot_narrow_radius_cm: 30.0
    robot_radius_cm: 40.0
    robot_base_clearance_cm: 10.0
  velocity_limits:
    max_linear_speed: 0.35  # m/s
    max_angular_speed: 0.6  # rad/s
  odometry:
    topic: /lidar_odometry
    odom_frame: odom
    base_frame: base_link
  topics:
    pointcloud: /hesai_ros_driver/hesai/lidar_points
    cmd_vel: /cmd_vel
