name: ROS 2 Humble
'on':
  push:
    branches: [main, V4]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  humble:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Isolated build, full tests and source-free installation
        run: bash scripts/ci/run_humble.sh
