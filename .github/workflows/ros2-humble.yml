name: ROS 2 Humble
'on':
  push:
    branches: [main, V4]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  humble:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mandatory Humble and Debian release validation
        run: bash scripts/ci/run_humble_release.sh
      - name: Preserve test reports and source binding
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: humble-release-test-evidence
          if-no-files-found: error
          path: |
            /tmp/r3d-release.*/
            /tmp/r3d-ci.*/build-results/**/pytest.xml
            /tmp/r3d-ci.*/build-results/**/*.xunit.xml
            /tmp/r3d-ci.*/runtime-results/*.xml
            /tmp/r3d-debian.*/**/*.xml
            /tmp/r3d-debian.*/**/*.json
            /tmp/r3d-debian.*/**/*.exit
